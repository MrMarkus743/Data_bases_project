name: BigData_project

services:
  postgres:
    image: postgres:16
    container_name: bigdata_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ultima
      POSTGRES_PASSWORD: ultima_dev_pw    
      POSTGRES_DB: landing_club           

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultima -d landing_club"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: