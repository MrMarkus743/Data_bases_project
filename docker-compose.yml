name: bigdata_project

services:
  postgres:
    image: postgres:16-alpine
    container_name: bigdata_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lending_club}
      POSTGRES_USER: ${POSTGRES_USER:-ultima}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    command: -c "shared_preload_libraries=pg_stat_statements"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/02_indexes_fk.sql:/docker-entrypoint-initdb.d/02_indexes_fk.sql
      - ./sql/03_seeds.sql:/docker-entrypoint-initdb.d/03_seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
