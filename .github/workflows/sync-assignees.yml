name: Sync Assignees to PR

on:
  pull_request:
    types: [opened, edited]

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - name: Copy assignees from linked issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUM: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Обработка PR #$PR_NUM в репозитории $GH_REPO..."
          
          # 1. Извлекаем номер связанного тикета
          ISSUE_NUM=$(echo "$PR_BODY" | grep -ioE "(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) #[0-9]+" | head -n 1 | grep -oE "[0-9]+" || true)

          if [ -n "$ISSUE_NUM" ]; then
            echo "Найдена связанная задача: #$ISSUE_NUM"
            # 2. Получаем логины исполнителей через API
            ASSIGNEES=$(gh issue view "$ISSUE_NUM" --repo "$GH_REPO" --json assignees -q '.assignees[].login' | tr '\n' ',' | sed 's/,$//' || true)

            if [ -n "$ASSIGNEES" ]; then
              echo "Назначаем исполнителей: $ASSIGNEES"
              gh pr edit "$PR_NUM" --repo "$GH_REPO" --add-assignee "$ASSIGNEES" || echo "Предупреждение: не удалось назначить $ASSIGNEES"
            else
              echo "В задаче нет исполнителей. Назначаем автора PR: $ACTOR"
              gh pr edit "$PR_NUM" --repo "$GH_REPO" --add-assignee "$ACTOR" || echo "Предупреждение: не удалось назначить $ACTOR"
            fi
          else
            echo "Связанная задача не указана. Назначаем автора PR: $ACTOR"
            gh pr edit "$PR_NUM" --repo "$GH_REPO" --add-assignee "$ACTOR" || echo "Предупреждение: не удалось назначить $ACTOR"
          fi
