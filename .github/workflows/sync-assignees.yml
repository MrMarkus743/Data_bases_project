name: Sync Assignees to PR

on:
  pull_request:
    types: [opened, edited]

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - name: Sync assignees from linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            // Ищем ключевые слова: Closes #10, fixes #5 и т.д.
            const match = body.match(/(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/i);
            
            let assignees = [context.actor];
            
            if (match) {
              const issueNumber = parseInt(match[1], 10);
              console.log(`Найдена связанная задача: #${issueNumber}`);
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                
                if (issue.data.assignees && issue.data.assignees.length > 0) {
                  assignees = issue.data.assignees.map(a => a.login);
                  console.log(`Назначаем исполнителей из задачи: ${assignees.join(', ')}`);
                } else {
                  console.log(`В задаче нет назначенных лиц. Назначаем автора PR: ${context.actor}`);
                }
              } catch (error) {
                console.log(`Предупреждение: не удалось прочитать задачу #${issueNumber}: ${error.message}`);
              }
            } else {
              console.log(`Связанная задача не найдена. Назначаем автора PR: ${context.actor}`);
            }
            
            // Назначаем исполнителей на Pull Request
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                assignees: assignees
              });
              console.log('Исполнители успешно назначены!');
            } catch (error) {
              console.log(`Ошибка назначения исполнителей: ${error.message}`);
            }
